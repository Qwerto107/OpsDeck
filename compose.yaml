name: opsdeck
services:
  api:
    image: ghcr.io/qwerto107/opsdeck:latest
    command: [bootstrap]
    user: "0:0"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      MASTER_KEY_FILE: /run/opsdeck-secrets/master.key
      INIT_USERNAME: ${INIT_USERNAME:-admin}
    volumes:
      - ./secrets:/run/opsdeck-secrets
    ports:
      - 127.0.0.1:8080:8080
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
