name: opsdeck
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: opsdeck
      POSTGRES_DB: opsdeck
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U opsdeck -d opsdeck]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    image: ghcr.io/qwerto107/opsdeck:latest
    command: [bootstrap]
    user: "0:0"
    environment:
      DATABASE_URL: postgres://opsdeck:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/opsdeck?sslmode=disable
      MASTER_KEY_FILE: /run/opsdeck-secrets/master.key
      INIT_USERNAME: ${INIT_USERNAME:-admin}
    volumes:
      - ./secrets:/run/opsdeck-secrets
    ports:
      - 127.0.0.1:8080:8080
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres-data:
